[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bulbopt-desktop"
dynamic = ["version"]
description = "Desktop tool for bulbous bow generation and optimization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jinja2>=3.1",
  "numpy>=1.26",
  "PySide6>=6.8",
  "pymeshfix>=0.17",
  "pymoo>=0.6",
  "pyvista>=0.44",
  "scikit-learn>=1.3",
  "trimesh>=4.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]
mesh-quality = [
  # ACVD-based isotropic remeshing for the bulb tip
  # (`bulbopt.optimization.parametric.anisotropic_remesh`). Optional
  # because pyacvd pulls a Cython extension that not every laptop
  # build environment can compile; the module degrades gracefully
  # to a no-op when this dependency is missing.
  "pyacvd>=0.2",
  # MeshLib-based edge-flip / split / collapse isotropic remeshing
  # for the visual-only polish of top-candidate STL outputs
  # (`bulbopt.optimization.parametric.isotropic_remesh`). Drops the
  # bulb-region max aspect ratio from ~3650 to ~6 on the production
  # hull while keeping the rest of the upper hull bit-identical. The
  # module degrades gracefully to a no-op when meshlib is missing.
  "meshlib>=3.1",
]

[tool.setuptools.dynamic]
version = {attr = "bulbopt.__version__"}

[tool.setuptools.package-data]
bulbopt = ["reporting/templates/*.j2", "reporting/templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
